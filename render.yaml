# Render blueprint for the APEX backend (FastAPI). The Next.js front end is deployed separately on Vercel.
# Free plan: the service starts from the committed snapshot in backend/seed/ (database + trained models),
# so it needs no disk and no training. See README → "Hosting" for the trade-offs and the paid alternative.
services:
  - type: web
    name: apex-f1-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: OPENF1_USERNAME
        sync: false
      - key: OPENF1_PASSWORD
        sync: false
