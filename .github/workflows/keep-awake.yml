name: Keep the API awake
# The free host sleeps after 15 idle minutes; waking costs the next visitor most of a minute and every result
# held in memory. The server also pings itself (APEX_KEEP_AWAKE); this is the second line, and it is what wakes
# the server again after a restart. Disable this workflow in the Actions tab to let the server sleep.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 120 -o /dev/null -w "%{http_code} in %{time_total}s\n" "${{ vars.API_URL || 'https://apex-f1-backend.onrender.com' }}/api/health" || echo "no answer this time"
